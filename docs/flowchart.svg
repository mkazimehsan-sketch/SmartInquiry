<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" width="800" height="960" font-family="Arial, Helvetica, sans-serif">
  <title>SmartInquiry workflow flowchart</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="800" height="960" fill="#ffffff"/>
  <text x="400" y="14" text-anchor="middle" font-size="11" fill="#6b7280">SmartInquiry - Day 1 workflow: intake -> validate -> classify -> draft -> human review</text>

  <!-- connectors -->
  <g stroke="#374151" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M380 64 L380 90"/>
    <path d="M380 150 L380 185"/>
    <path d="M380 285 L380 320"/>
    <path d="M520 235 L580 235"/>
    <path d="M665 210 L665 120 L522 120"/>
    <path d="M380 384 L380 415"/>
    <path d="M230 470 L130 470 L130 560"/>
    <path d="M530 470 L630 470 L630 560"/>
    <path d="M130 624 L130 722 L240 722"/>
    <path d="M630 624 L630 722 L520 722"/>
    <path d="M380 754 L380 790"/>
    <path d="M230 845 L200 845"/>
    <path d="M115 820 L115 775 L330 775 L330 756"/>
    <path d="M530 845 L570 845"/>
  </g>

  <!-- start -->
  <rect x="240" y="20" width="280" height="44" rx="22" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <text x="380" y="47" text-anchor="middle" font-size="14" fill="#111827">Customer inquiry arrives</text>

  <!-- 1 intake -->
  <rect x="240" y="90" width="280" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="114" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">1. INTAKE</text>
  <text x="380" y="134" text-anchor="middle" font-size="12" fill="#1e3a8a">Form: name, email, order ID, message</text>

  <!-- 2 validate -->
  <polygon points="380,185 520,235 380,285 240,235" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="231" text-anchor="middle" font-size="14" font-weight="bold" fill="#78350f">2. VALIDATE</text>
  <text x="380" y="249" text-anchor="middle" font-size="11" fill="#78350f">Message not blank? Email OK?</text>
  <text x="550" y="228" text-anchor="middle" font-size="12" fill="#374151">no</text>
  <text x="394" y="306" font-size="12" fill="#374151">yes</text>
  <rect x="580" y="210" width="170" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="665" y="232" text-anchor="middle" font-size="12" fill="#7f1d1d">Show error message,</text>
  <text x="665" y="249" text-anchor="middle" font-size="12" fill="#7f1d1d">ask user to fix input</text>

  <!-- 3 classify -->
  <rect x="240" y="320" width="280" height="64" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="380" y="345" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">3. CLASSIFY</text>
  <text x="380" y="365" text-anchor="middle" font-size="12" fill="#1e3a8a">Keyword rules: pricing / order / support / other</text>

  <!-- decision -->
  <polygon points="380,415 530,470 380,525 230,470" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">One clear</text>
  <text x="380" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">category?</text>
  <text x="180" y="462" text-anchor="middle" font-size="12" fill="#374151">yes</text>
  <text x="580" y="462" text-anchor="middle" font-size="12" fill="#374151">no</text>

  <!-- 4 draft -->
  <rect x="30" y="560" width="200" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="130" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">4a. DRAFT</text>
  <text x="130" y="603" text-anchor="middle" font-size="11" fill="#14532d">Category template with</text>
  <text x="130" y="617" text-anchor="middle" font-size="11" fill="#14532d">placeholders (no invented facts)</text>

  <rect x="520" y="560" width="220" height="64" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
  <text x="630" y="584" text-anchor="middle" font-size="14" font-weight="bold" fill="#7c2d12">4b. FALLBACK DRAFT</text>
  <text x="630" y="603" text-anchor="middle" font-size="11" fill="#7c2d12">Ask for clarification; flag as</text>
  <text x="630" y="617" text-anchor="middle" font-size="11" fill="#7c2d12">mixed / unclear / unsupported</text>

  <!-- 5 review -->
  <rect x="240" y="690" width="280" height="64" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="380" y="715" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">5. HUMAN REVIEW</text>
  <text x="380" y="735" text-anchor="middle" font-size="12" fill="#4c1d95">Support assistant reads and edits the draft</text>

  <!-- approve decision -->
  <polygon points="380,790 530,845 380,900 230,845" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="380" y="850" text-anchor="middle" font-size="13" font-weight="bold" fill="#78350f">Approve draft?</text>
  <text x="550" y="838" text-anchor="middle" font-size="12" fill="#374151">yes</text>
  <text x="215" y="836" text-anchor="middle" font-size="12" fill="#374151">no</text>

  <rect x="30" y="820" width="170" height="50" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="115" y="842" text-anchor="middle" font-size="12" fill="#7f1d1d">Reviewer edits draft</text>
  <text x="115" y="858" text-anchor="middle" font-size="11" fill="#7f1d1d">(loops back to review)</text>

  <rect x="570" y="815" width="210" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="675" y="840" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Reply marked APPROVED</text>
  <text x="675" y="858" text-anchor="middle" font-size="11" fill="#14532d">Human sends it manually</text>

  <!-- note -->
  <rect x="140" y="915" width="520" height="32" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="400" y="936" text-anchor="middle" font-size="12" fill="#111827">Safeguard: SmartInquiry never auto-sends. A human approval is always required.</text>
</svg>
